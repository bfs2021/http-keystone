name: Docs Checker

on: [push, pull_request]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Generate documentation
        run: gomarkdoc -o "{{.Dir}}/DOCS.md" ./...

      - name: Verify documentation is up to date
        run: |
          if ! git diff -w --exit-code; then
            echo "::error::Documentation is out of date!"
            echo "Please run 'gomarkdoc -o \"{{.Dir}}/DOCS.md\" ./...' locally and commit the changes."
            exit 1
          fi
